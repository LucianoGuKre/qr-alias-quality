<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartel para imprimir · Quality impresiones</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="cartel.css">
</head>
<body>
  <!-- Barra que solo se ve en pantalla, no sale en la impresión -->
  <div class="barra">
    <button type="button" onclick="window.print()">🖨️ Imprimir cartel (A4)</button>
    <span>QR apunta a: <code id="destino"></code></span>
  </div>

  <main class="hoja">
    <!-- El logo ya dice "Quality impresiones"; el alt lo lee igual quien no ve la imagen -->
    <h1><img class="logo" src="img/logo-quality.png" alt="Quality impresiones"></h1>
    <p class="subtitulo">Transferí fácil por alias</p>

    <!-- Acá se dibuja el QR (SVG, se imprime nítido a cualquier tamaño) -->
    <div class="qr" id="qr" role="img" aria-label="Código QR para copiar el alias"></div>

    <p class="escanea">
      <span class="flecha" aria-hidden="true">↑</span>
      Escaneá con la <strong>cámara de tu celular</strong>
    </p>

    <!-- Pasos cortos y numerados: para que nadie se pierda -->
    <ol class="pasos">
      <li>Abrí la <strong>cámara</strong> y apuntá al código</li>
      <li>Tocá el botón <strong>“Copiar alias”</strong></li>
      <li>Pegalo en tu banco o billetera y <strong>transferí</strong></li>
    </ol>

    <p class="alias-pie">Alias: <strong data-campo="alias">rolo.quality</strong></p>
  </main>

  <script src="config.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="cartel.js"></script>
</body>
</html>
